services:
  frontend:
    build:
      context: ./clients/frontend
      dockerfile: Dockerfile
    env_file:
        - .env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4321}:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend/main
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
   
    env_file:
        - .env
    environment:
      SECRET_KEY: ${SECRET_KEY:-R3jGXtUslvpf0-vYb78q0pTmr57X31i45ip6bIRfSzg6yzMue2vWRqgWoYFBRdorhKS6hrbN6TxTRuOS6wLVsQ}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-noreply@akiora.local}
      EMAIL_NAME: ${EMAIL_NAME:-Akiora Team}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-akiora-local}
      SMTP_SERVER: ${SMTP_SERVER:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/akiora}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-akiora}
    env_file:
        - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    env_file:
        - .env
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s



  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@akiora.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
