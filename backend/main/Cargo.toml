[package]
name = "main"
version = "0.1.0"
edition = "2024"



[dependencies]
actix-identity = "0.9.0"
actix-session = { version = "0.11.0", features = ["cookie-session", "redis-session"] }
actix-web = "4.14.0"
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls"] }
rand = "0.9.2"
redis = { version = "1.3.0", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2.0.18"
time = "0.3.51"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.22"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.4", features = ["serde", "v4", "v7"] }
validator = { version = "0.20.0", features = ["derive"] }
