[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
bson = { version = "3.1.0", features = ["serde", "uuid-1"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.32"
mongodb = "3.7.0"
redis = { version = "1.3.0", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3.21.0", features = ["macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.4", features = ["serde", "v4", "v7"] }
